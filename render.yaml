services:
  - type: web
    name: atomquest-goal-management-portal
    runtime: python
    buildCommand: ""
    startCommand: "python app/server.py --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: APP_DEBUG
        value: "0"

